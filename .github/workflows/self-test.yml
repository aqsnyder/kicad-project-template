# Proves the template with real KiCad 10 and the pinned tools: makes a demo repository with
# scripts/kicad_template.py, then runs what an adopting repository's hardware workflow runs.
name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    # The hardware workflow's library job, on a demo repository: no KiCad, just Python and the pinned importer.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r repo-files/requirements-tools.txt
      - name: Demo repository, then the library check
        run: |
          demo="$RUNNER_TEMP/demo"
          mkdir -p "$demo"
          python3 scripts/kicad_template.py init-repo "$demo" --prefix demo_
          (cd "$demo" && kicad-part-importer --library hw/lib --check-3d)
      - name: The starter board matches its fab profile
        run: python3 repo-files/fab.py verify templates/starter-board
      - name: fab.py refuses a profile with a clearance rule, or without a copper-layer range
        run: |
          refuses() {   # refuses WHY PROFILE: fab.py must reject the profile, and name WHY in its message
            d=$(mktemp -d); cp fabs/*.kicad_dru "$d/"; printf '%b' "$2" > "$d/bad.kicad_dru"
            if python3 repo-files/fab.py --fabs "$d" list 2> "$d/err"; then echo "::error::accepted a profile with $1"; exit 1; fi
            cat "$d/err"; grep -q "$1" "$d/err" || { echo "::error::refused the profile, but not for $1"; exit 1; }
          }
          refuses 'clearance constraint' \
            '(version 1)\n# fab-profile: bad\n# fab-name: Bad\n# copper-layers: 1-2\n(rule "x" (constraint clearance (min 0.1mm)))\n'
          refuses 'copper-layers' '(version 1)\n# fab-profile: bad\n# fab-name: Bad\n'

  kicad10:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # KiCad's official image, the same one the hardware workflow uses.
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools the KiCad image lacks
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git python3-venv python3-pip poppler-utils ca-certificates
          kicad-cli version

      - uses: actions/checkout@v7

      - name: Folders
        run: |
          echo "DEMO=$RUNNER_TEMP/demo" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/ci-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/demo" "$RUNNER_TEMP/ci-output"
          kicad-cli version > "$RUNNER_TEMP/ci-output/kicad-version.txt"

      - name: Install the tools
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r repo-files/requirements-tools.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@example.com
          # As in the hardware workflow: the job runs as root, but the checkout belongs to the runner user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Template files are in the current KiCad format
        continue-on-error: true
        run: |
          tmp=$(mktemp -d); cp -r templates/starter-board/. "$tmp/"
          kicad-cli sch upgrade --force "$tmp/starter-board.kicad_sch"
          kicad-cli pcb upgrade --force "$tmp/starter-board.kicad_pcb"
          mkdir -p "$OUT/upgraded"; cp "$tmp"/starter-board.kicad_{sch,pcb,pro} "$OUT/upgraded/"
          for f in starter-board.kicad_sch starter-board.kicad_pcb; do
            if ! diff -q <(grep -v generator_version "templates/starter-board/$f") \
                         <(grep -v generator_version "$tmp/$f") >/dev/null; then
              echo "::warning file=templates/starter-board/$f::KiCad would rewrite this file; re-save it in KiCad"
            fi
          done

      - name: Make a demo repository from the template
        run: |
          git -C "$DEMO" init -q -b main
          python3 scripts/kicad_template.py init-repo "$DEMO" --prefix demo_
          python3 scripts/kicad_template.py new-board "$DEMO/hw/demo-board" --title "Demo board" \
            --company "Example Co" --designer "CI"
          python3 "$DEMO/hw/fab.py" verify --all
          git -C "$DEMO" add -A
          git -C "$DEMO" -c user.name=ci -c user.email=ci@example.com commit -qm "Demo from the template"

      - name: Part library check
        working-directory: ${{ env.DEMO }}
        run: kicad-part-importer --library hw/lib --check-3d

      - name: ERC and DRC (all severities shown, errors fail)
        working-directory: ${{ env.DEMO }}
        run: |
          status=0
          for pro in hw/*/*.kicad_pro; do
            dir=$(dirname "$pro"); name=$(basename "$pro" .kicad_pro)
            kicad-cli sch erc --severity-all -o "$OUT/$name-erc.rpt" "$dir/$name.kicad_sch" || status=1
            kicad-cli pcb drc --severity-all --schematic-parity -o "$OUT/$name-drc.rpt" "$dir/$name.kicad_pcb" || status=1
            cat "$OUT/$name-erc.rpt" "$OUT/$name-drc.rpt" || true
            kicad-cli sch erc --severity-error --exit-code-violations -o "$RUNNER_TEMP/e.rpt" \
              "$dir/$name.kicad_sch" || status=1
            kicad-cli pcb drc --severity-error --schematic-parity --exit-code-violations -o "$RUNNER_TEMP/d.rpt" \
              "$dir/$name.kicad_pcb" || status=1
          done
          exit $status

      - name: Fab package
        if: always()
        working-directory: ${{ env.DEMO }}
        run: |
          set -o pipefail
          rc=0
          kicad-macrofab-bom HEAD --project-dir hw/demo-board --out "$OUT/fab/bom" 2>&1 \
            | tee "$OUT/macrofab-bom.log" || rc=1
          kicad-fab-export HEAD --project-dir hw/demo-board --out "$OUT/fab" 2>&1 \
            | tee "$OUT/fab-export.log" || true
          # The starter board has no parts. kicad-fab-package 0.1.0 fails one check that needs at least one
          # placed part ("... on the 0 parts whose origin is the pad centre"); any other FAIL fails this step.
          grep -q '^RESULT: ' "$OUT/fab-export.log" || rc=1
          if grep -E '^\s+FAIL ' "$OUT/fab-export.log" | grep -v 'on the 0 parts whose origin is the pad centre'; then
            rc=1
          fi
          # kicad-fab-package 0.1.0 does not copy .kicad_wks files into its project copy, so its schematic PDF
          # falls back to KiCad's default drawing sheet. Report it until the tool carries the sheet.
          if ! pdftotext "$OUT/fab/docs/demo-board_v0.1_schematic.pdf" - | grep -q 'Designed by'; then
            echo "::warning::fab package schematic PDF uses KiCad's default drawing sheet, not drawing-sheet.kicad_wks"
          fi
          exit $rc

      - name: Fab tools run git in the checkout itself
        if: always()
        run: |
          # The demo repository is root's own. In an adopting repository the fab tools run git in the actions/checkout
          # workspace, which the runner user owns while the job runs as root, so test that case on the starter board in
          # this checkout. This proves the git calls work; the step above judges the package itself.
          if GIT_CONFIG_GLOBAL=/dev/null git rev-parse HEAD >/dev/null 2>&1; then
            echo "::warning::git accepts this checkout even without safe.directory, so this step no longer tests it"
          fi
          set -o pipefail
          rc=0
          kicad-macrofab-bom HEAD --project-dir templates/starter-board --out "$OUT/checkout-fab/bom" 2>&1 \
            | tee "$OUT/checkout-macrofab-bom.log" || rc=1
          kicad-fab-export HEAD --project-dir templates/starter-board --out "$OUT/checkout-fab" 2>&1 \
            | tee "$OUT/checkout-fab-export.log" || true
          # kicad-fab-export prints RESULT only after its git calls have worked; before that it stops with ERROR.
          grep -q '^RESULT: ' "$OUT/checkout-fab-export.log" || rc=1
          if grep -i 'dubious ownership' "$OUT"/checkout-*.log; then rc=1; fi
          exit $rc

      - name: Render the title blocks
        if: always()
        working-directory: ${{ env.DEMO }}
        run: |
          d=hw/demo-board
          kicad-cli sch export pdf -o "$OUT/schematic.pdf" "$d/demo-board.kicad_sch" 2>&1 | tee "$OUT/render.log"
          pdftoppm -png -r 100 "$OUT/schematic.pdf" "$OUT/schematic"
          kicad-cli pcb export pdf -l Edge.Cuts,F.Silkscreen --include-border-title \
            -o "$OUT/board.pdf" "$d/demo-board.kicad_pcb" 2>&1 | tee -a "$OUT/render.log" || true
          if [ -f "$OUT/board.pdf" ]; then pdftoppm -png -r 100 "$OUT/board.pdf" "$OUT/board"; fi
          pdftotext -layout "$OUT/schematic.pdf" "$OUT/schematic.txt"
          tail -n 25 "$OUT/schematic.txt"
          if grep -q 'Error loading drawing sheet' "$OUT/render.log"; then
            echo "::error file=templates/starter-board/drawing-sheet.kicad_wks::KiCad could not load the drawing sheet"
            exit 1
          fi
          grep -q 'Designed by: CI' "$OUT/schematic.txt" || { echo "::error::title block text variables did not resolve"; exit 1; }
          grep -q 'Fab: PCBWay standard' "$OUT/schematic.txt" || { echo "::error::FAB text variable did not resolve"; exit 1; }

      - name: Fab profiles (switching keeps board rules; each fab finds its own limits, on its own layer counts)
        if: always()
        run: |
          set -e
          FX="$RUNNER_TEMP/fx"; mkdir -p "$FX"
          python3 scripts/kicad_template.py init-repo "$FX" --no-library
          python3 scripts/kicad_template.py new-board "$FX/hw/fixture" --fab jlcpcb-2layer --designer CI
          python3 tests/make_fixture.py "$FX/hw/fixture"
          python3 scripts/kicad_template.py new-board "$FX/hw/fixture4" --fab jlcpcb-multilayer --designer CI
          python3 tests/make_fixture.py "$FX/hw/fixture4" --copper-layers 4
          cd "$FX"
          printf '(rule "board: test rule"\n\t(constraint track_width (min 0.11mm))\n\t(condition "A.NetName == %s"))\n' "'nosuchnet'" \
            >> hw/fixture/fixture.kicad_dru
          python3 hw/fab.py set pcbway-standard fixture
          python3 hw/fab.py set jlcpcb-2layer fixture
          grep -q 'board: test rule' hw/fixture/fixture.kicad_dru || { echo "::error::board rule lost on switch"; exit 1; }
          python3 hw/fab.py verify --all
          python3 hw/fab.py check --all --json > "$OUT/fab-check.json"
          python3 hw/fab.py check --all | tee "$OUT/fab-check.txt"
          python3 hw/fab.py check --all --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/tests/check_fixture.py" "$OUT/fab-check.json"

      - name: A rules file KiCad cannot read is reported, not silently skipped
        if: always()
        run: |
          FX="$RUNNER_TEMP/fx"; B="$RUNNER_TEMP/fabs-broken"; rm -rf "$B"; cp -r "$FX/hw/fabs" "$B"
          printf '(version 1)\n# fab-profile: broken\n# fab-name: Broken\n# copper-layers: 1-6\n(rule "typo" (constraint track_width (min 0.1mm)) (condition "A.Typo == 1"))\n(rule "bad" (constraint nonsense (min 1mm)))\n' \
            > "$B/broken.kicad_dru"
          rc=0; python3 "$FX/hw/fab.py" --fabs "$B" check "$FX/hw/fixture" --json > "$OUT/fab-check-broken.json" || rc=$?
          python3 - "$OUT/fab-check-broken.json" "$rc" <<'PY'
          import json, sys
          r = next(iter(json.load(open(sys.argv[1])).values()))['fabs']
          loaded = {k: v['rules_loaded'] for k, v in r.items() if v['applies']}
          print(loaded, 'exit', sys.argv[2])
          ok = sys.argv[2] == '1' and loaded.pop('broken') is False and all(loaded.values())
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: self-test-output
          path: ${{ env.OUT }}
