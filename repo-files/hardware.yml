# KiCad checks for the boards in hw/<board>/ and the part library in hw/lib/.
# From aqsnyder/kicad-project-template.
#   every push or pull request touching hw/: library model paths, ERC and DRC with each board's fab rules,
#     a warning if a board's fab settings drift from hw/fabs, and a table of which fabs can make each board
#     (in the run summary)
#   every hw-v* tag (hw-v0.1, hw-v1.0-rc1, ...): also the fab package of every board (kicad-macrofab-bom +
#     kicad-fab-export), as an artifact named fab-<tag>
name: hardware

on:
  push:
    branches: ["**"]
    # Hardware release tags. Path filters do not apply to tags, so "**" would build fab packages for every tag in a
    # repository that also holds firmware or software. Keep "/" out of the pattern: the artifact is named
    # fab-<tag>, and artifact names cannot contain "/" (the "*" here does not match one).
    tags: ["hw-v*"]
    paths: ["hw/**", "kicad-fab.toml", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hw/**", "kicad-fab.toml", ".github/workflows/hardware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: part library
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r hw/requirements-tools.txt
      # No KiCad needed: fails on bare, absolute, other-variable, wrong-case and missing model paths.
      - run: kicad-part-importer --library hw/lib --check-3d

  boards:
    name: ERC, DRC and fab package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # KiCad's official image from Docker Hub. "-full" carries KiCad's 3D models for the STEP export. Change the
      # tag to move to another KiCad release (kicad-fab-package needs KiCad 10).
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools the KiCad image lacks
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git python3-venv python3-pip ca-certificates
          kicad-cli version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # kicad-fab-export reads the commit with git archive
          submodules: recursive
      - name: Install the tools
        run: |
          # --system-site-packages lets the tools import KiCad's pcbnew module
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r hw/requirements-tools.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          # The job runs as root, but the checkout belongs to the runner user and actions/checkout removes its own
          # safe.directory entry when it finishes. Without this, git refuses the checkout ("dubious ownership") and
          # kicad-macrofab-bom and kicad-fab-export fail on every tag.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ERC and DRC
        run: |
          shopt -s nullglob
          status=0
          for pro in hw/*/*.kicad_pro; do
            dir=$(dirname "$pro"); name=$(basename "$pro" .kicad_pro)
            echo "::group::$dir"
            kicad-cli sch erc --severity-error --exit-code-violations \
              -o "$RUNNER_TEMP/$name-erc.rpt" "$dir/$name.kicad_sch" || status=1
            kicad-cli pcb drc --severity-error --schematic-parity --exit-code-violations \
              -o "$RUNNER_TEMP/$name-drc.rpt" "$dir/$name.kicad_pcb" || status=1
            cat "$RUNNER_TEMP/$name-erc.rpt" "$RUNNER_TEMP/$name-drc.rpt"
            echo "::endgroup::"
          done
          exit $status
      - name: Fab settings match hw/fabs
        run: |
          python3 hw/fab.py verify --all || \
            echo "::warning::A board's fab rules or Board Setup minimums differ from its profile in hw/fabs (fix command in the log)"
      - name: Fab check (which fabs can make each board)
        if: always()
        run: |
          # Fails when KiCad could not load a board's rules (it gives no message of its own).
          set -o pipefail
          python3 hw/fab.py check --all --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fab packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A board that fails does not stop the others; the step fails at the end and the upload still runs.
          shopt -s nullglob
          status=0
          for pro in hw/*/*.kicad_pro; do
            dir=$(dirname "$pro"); board=$(basename "$dir")
            echo "::group::$dir"
            kicad-macrofab-bom HEAD --project-dir "$dir" --out "out/$board/bom" || status=1
            kicad-fab-export HEAD --project-dir "$dir" --out "out/$board" || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          name: fab-${{ github.ref_name }}
          path: out/
